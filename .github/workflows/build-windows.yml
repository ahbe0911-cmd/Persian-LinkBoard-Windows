name: Build Persian LinkBoard Windows

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Download Vazirmatn v33.003 fonts
        shell: pwsh
        run: |
          $fontDir = "src/PersianLinkBoard/Fonts"
          New-Item -ItemType Directory -Force -Path $fontDir | Out-Null
          $base = "https://raw.githubusercontent.com/rastikerdar/vazirmatn/v33.003/fonts/ttf"
          Invoke-WebRequest "$base/Vazirmatn-Regular.ttf" -OutFile "$fontDir/Vazirmatn-Regular.ttf"
          Invoke-WebRequest "$base/Vazirmatn-Medium.ttf" -OutFile "$fontDir/Vazirmatn-Medium.ttf"
          Invoke-WebRequest "$base/Vazirmatn-SemiBold.ttf" -OutFile "$fontDir/Vazirmatn-SemiBold.ttf"
          Invoke-WebRequest "$base/Vazirmatn-Bold.ttf" -OutFile "$fontDir/Vazirmatn-Bold.ttf"

      - name: Generate LinkBoard app icon
        shell: pwsh
        run: ./tools/Generate-AppIcon.ps1

      - name: Build Release
        shell: pwsh
        run: msbuild src/PersianLinkBoard/PersianLinkBoard.csproj /t:Rebuild /p:Configuration=Release /p:Platform=AnyCPU

      - name: Prepare portable artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item src/PersianLinkBoard/bin/Release/PersianLinkBoard.exe dist/PersianLinkBoard.exe
          if (Test-Path src/PersianLinkBoard/bin/Release/PersianLinkBoard.exe.config) {
            Copy-Item src/PersianLinkBoard/bin/Release/PersianLinkBoard.exe.config dist/PersianLinkBoard.exe.config
          }

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - name: Build installer
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $iscc)) { throw "ISCC.exe not found" }
          & $iscc installer/PersianLinkBoard.iss

      - name: Upload portable EXE
        uses: actions/upload-artifact@v4
        with:
          name: Persian-LinkBoard-Portable
          path: dist/*
          if-no-files-found: error

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: Persian-LinkBoard-Installer
          path: dist-installer/Persian-LinkBoard-Setup.exe
          if-no-files-found: error
